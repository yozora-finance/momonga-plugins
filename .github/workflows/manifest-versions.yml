# Resolve each client's source from its marketplace; both manifests must share a release version.
name: manifest-versions
on:
  pull_request:
  push:
    branches: [main]
jobs:
  same-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/check-manifests.py
      - run: python3 .github/test-package.py
      - run: node --test .github/test-refresh.cjs
