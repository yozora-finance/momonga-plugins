<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730" role="img" aria-labelledby="title desc"><title id="title">認証から、最初の検索まで</title><desc id="desc">Claude / ChatGPT のログインとは別に、モモンガへの接続が必要です。。プラグインの「接続」を選ぶ：接続先は https://mcp.momongasearch.com/mcp。ブラウザでモモンガにログイン：認証先：auth.momongasearch.com ／ 利用権限のあるアカウントを使用。。表示された権限を確認して、接続を許可：既にログイン・許可済みの場合は、そのままアプリへ戻ることもあります。。元のアプリで接続を確認 → 新規チャット：検索ツールの使用確認が出たら内容を確認して許可。出典付きの結果を確認。</desc><rect width="100%" height="100%" rx="24" fill="#f5f3ec"/><g font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="48" y="40" font-size="15" fill="#72705e">MOMONGA SEARCH  /  操作ガイド図（実画面ではありません）</text><text x="48" y="88" font-size="30" font-weight="700" fill="#243a32">認証から、最初の検索まで</text><text x="48" y="123" font-size="18" fill="#53645c">Claude / ChatGPT のログインとは別に、モモンガへの接続が必要です。</text><rect x="48" y="150" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="189" r="23" fill="#315f49"/><text x="88" y="197" text-anchor="middle" font-size="23" fill="white">1</text><text x="130" y="189" font-size="24" font-weight="600" fill="#243a32">プラグインの「接続」を選ぶ</text><text x="130" y="226" font-size="19" fill="#53645c">接続先は https://mcp.momongasearch.com/mcp</text><rect x="48" y="280" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="319" r="23" fill="#315f49"/><text x="88" y="327" text-anchor="middle" font-size="23" fill="white">2</text><text x="130" y="319" font-size="24" font-weight="600" fill="#243a32">ブラウザでモモンガにログイン</text><text x="130" y="356" font-size="19" fill="#53645c">認証先：auth.momongasearch.com ／ 利用権限のあるアカウントを使用。</text><rect x="48" y="410" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="449" r="23" fill="#315f49"/><text x="88" y="457" text-anchor="middle" font-size="23" fill="white">3</text><text x="130" y="449" font-size="24" font-weight="600" fill="#243a32">表示された権限を確認して、接続を許可</text><text x="130" y="486" font-size="19" fill="#53645c">既にログイン・許可済みの場合は、そのままアプリへ戻ることもあります。</text><rect x="48" y="540" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="579" r="23" fill="#315f49"/><text x="88" y="587" text-anchor="middle" font-size="23" fill="white">4</text><text x="130" y="579" font-size="24" font-weight="600" fill="#243a32">元のアプリで接続を確認 → 新規チャット</text><text x="130" y="616" font-size="19" fill="#53645c">検索ツールの使用確認が出たら内容を確認して許可。出典付きの結果を確認。</text><text x="48" y="702" font-size="17" fill="#53645c">ログインできても検索が拒否される場合は、本人・法人の利用権限を確認します。</text></g></svg>
