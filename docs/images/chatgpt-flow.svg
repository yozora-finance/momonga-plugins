<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730" role="img" aria-labelledby="title desc"><title id="title">ChatGPT で使うには</title><desc id="desc">このリポジトリの MCP 同梱プラグインは、デスクトップで利用します。。個人：デスクトップの Codex で登録：Codex の手順でマーケットプレイスとプラグインを追加。。組織：管理者がマーケットプレイスを取り込む：Admin → Plugins → Add → Import marketplace（詳細は本文）。メンバー本人がプラグインを追加・認証：Plugins からモモンガを選び、自分のモモンガアカウントで接続。。新しいチャットで @ から選ぶ：Web のみの場合は、カスタム MCP 接続の条件を本文で確認。</desc><rect width="100%" height="100%" rx="24" fill="#f5f3ec"/><g font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="48" y="40" font-size="15" fill="#72705e">MOMONGA SEARCH  /  操作ガイド図（実画面ではありません）</text><text x="48" y="88" font-size="30" font-weight="700" fill="#243a32">ChatGPT で使うには</text><text x="48" y="123" font-size="18" fill="#53645c">このリポジトリの MCP 同梱プラグインは、デスクトップで利用します。</text><rect x="48" y="150" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="189" r="23" fill="#315f49"/><text x="88" y="197" text-anchor="middle" font-size="23" fill="white">1</text><text x="130" y="189" font-size="24" font-weight="600" fill="#243a32">個人：デスクトップの Codex で登録</text><text x="130" y="226" font-size="19" fill="#53645c">Codex の手順でマーケットプレイスとプラグインを追加。</text><rect x="48" y="280" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="319" r="23" fill="#315f49"/><text x="88" y="327" text-anchor="middle" font-size="23" fill="white">2</text><text x="130" y="319" font-size="24" font-weight="600" fill="#243a32">組織：管理者がマーケットプレイスを取り込む</text><text x="130" y="356" font-size="19" fill="#53645c">Admin → Plugins → Add → Import marketplace（詳細は本文）</text><rect x="48" y="410" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="449" r="23" fill="#315f49"/><text x="88" y="457" text-anchor="middle" font-size="23" fill="white">3</text><text x="130" y="449" font-size="24" font-weight="600" fill="#243a32">メンバー本人がプラグインを追加・認証</text><text x="130" y="486" font-size="19" fill="#53645c">Plugins からモモンガを選び、自分のモモンガアカウントで接続。</text><rect x="48" y="540" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="579" r="23" fill="#315f49"/><text x="88" y="587" text-anchor="middle" font-size="23" fill="white">4</text><text x="130" y="579" font-size="24" font-weight="600" fill="#243a32">新しいチャットで @ から選ぶ</text><text x="130" y="616" font-size="19" fill="#53645c">Web のみの場合は、カスタム MCP 接続の条件を本文で確認。</text><text x="48" y="702" font-size="17" fill="#53645c">Web の MCP 接続だけでは、24 種類の Skills はインストールされません。</text></g></svg>
