<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730" role="img" aria-labelledby="title desc"><title id="title">Claude Web / Desktop の接続手順</title><desc id="desc">同じ Claude アカウント・組織で設定を確認します。。カスタマイズ → プラグイン → ＋ 追加：マーケットプレイスを追加 → リポジトリから追加。URL を入力 → 同期：https://github.com/yozora-finance/momonga-plugins。モモンガサーチ＋スキルを追加：プラグインを開く → コネクタ → momonga → 接続／連携。モモンガにログイン → Claude に戻る：「接続済み」を確認して、新しいチャットで /factsheet を選ぶ。</desc><rect width="100%" height="100%" rx="24" fill="#f5f3ec"/><g font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="48" y="40" font-size="15" fill="#72705e">MOMONGA SEARCH  /  操作ガイド図（実画面ではありません）</text><text x="48" y="88" font-size="30" font-weight="700" fill="#243a32">Claude Web / Desktop の接続手順</text><text x="48" y="123" font-size="18" fill="#53645c">同じ Claude アカウント・組織で設定を確認します。</text><rect x="48" y="150" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="189" r="23" fill="#315f49"/><text x="88" y="197" text-anchor="middle" font-size="23" fill="white">1</text><text x="130" y="189" font-size="24" font-weight="600" fill="#243a32">カスタマイズ → プラグイン → ＋ 追加</text><text x="130" y="226" font-size="19" fill="#53645c">マーケットプレイスを追加 → リポジトリから追加</text><rect x="48" y="280" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="319" r="23" fill="#315f49"/><text x="88" y="327" text-anchor="middle" font-size="23" fill="white">2</text><text x="130" y="319" font-size="24" font-weight="600" fill="#243a32">URL を入力 → 同期</text><text x="130" y="356" font-size="19" fill="#53645c">https://github.com/yozora-finance/momonga-plugins</text><rect x="48" y="410" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="449" r="23" fill="#315f49"/><text x="88" y="457" text-anchor="middle" font-size="23" fill="white">3</text><text x="130" y="449" font-size="24" font-weight="600" fill="#243a32">モモンガサーチ＋スキルを追加</text><text x="130" y="486" font-size="19" fill="#53645c">プラグインを開く → コネクタ → momonga → 接続／連携</text><rect x="48" y="540" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="579" r="23" fill="#315f49"/><text x="88" y="587" text-anchor="middle" font-size="23" fill="white">4</text><text x="130" y="579" font-size="24" font-weight="600" fill="#243a32">モモンガにログイン → Claude に戻る</text><text x="130" y="616" font-size="19" fill="#53645c">「接続済み」を確認して、新しいチャットで /factsheet を選ぶ。</text><text x="48" y="702" font-size="17" fill="#53645c">接続済みになるまでが初期設定。その後、検索結果を確認します。</text></g></svg>
