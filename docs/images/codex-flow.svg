<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730" role="img" aria-labelledby="title desc"><title id="title">Codex の接続手順</title><desc id="desc">初回の登録は Codex に依頼できます。貼り付け用の依頼文は本文にあります。。Codex の新しいチャットに、導入を依頼：CLI の確認 → マーケットプレイス登録 → スキル付き版のインストール。プラグインの詳細を開く：Plugins → Momonga by Yozora Finance → モモンガサーチ＋スキル。接続設定から、モモンガにログイン：Connect／接続を選び、ブラウザで認証を完了してアプリに戻る。。新しいチャットでプラグインを選ぶ：@ からモモンガを選択 → 企業名と調べたい内容を送る。</desc><rect width="100%" height="100%" rx="24" fill="#f5f3ec"/><g font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="48" y="40" font-size="15" fill="#72705e">MOMONGA SEARCH  /  操作ガイド図（実画面ではありません）</text><text x="48" y="88" font-size="30" font-weight="700" fill="#243a32">Codex の接続手順</text><text x="48" y="123" font-size="18" fill="#53645c">初回の登録は Codex に依頼できます。貼り付け用の依頼文は本文にあります。</text><rect x="48" y="150" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="189" r="23" fill="#315f49"/><text x="88" y="197" text-anchor="middle" font-size="23" fill="white">1</text><text x="130" y="189" font-size="24" font-weight="600" fill="#243a32">Codex の新しいチャットに、導入を依頼</text><text x="130" y="226" font-size="19" fill="#53645c">CLI の確認 → マーケットプレイス登録 → スキル付き版のインストール</text><rect x="48" y="280" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="319" r="23" fill="#315f49"/><text x="88" y="327" text-anchor="middle" font-size="23" fill="white">2</text><text x="130" y="319" font-size="24" font-weight="600" fill="#243a32">プラグインの詳細を開く</text><text x="130" y="356" font-size="19" fill="#53645c">Plugins → Momonga by Yozora Finance → モモンガサーチ＋スキル</text><rect x="48" y="410" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="449" r="23" fill="#315f49"/><text x="88" y="457" text-anchor="middle" font-size="23" fill="white">3</text><text x="130" y="449" font-size="24" font-weight="600" fill="#243a32">接続設定から、モモンガにログイン</text><text x="130" y="486" font-size="19" fill="#53645c">Connect／接続を選び、ブラウザで認証を完了してアプリに戻る。</text><rect x="48" y="540" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="579" r="23" fill="#315f49"/><text x="88" y="587" text-anchor="middle" font-size="23" fill="white">4</text><text x="130" y="579" font-size="24" font-weight="600" fill="#243a32">新しいチャットでプラグインを選ぶ</text><text x="130" y="616" font-size="19" fill="#53645c">@ からモモンガを選択 → 企業名と調べたい内容を送る。</text><text x="48" y="702" font-size="17" fill="#53645c">インストール完了と、モモンガへの接続完了は別の段階です。</text></g></svg>
