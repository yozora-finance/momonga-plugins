<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730" role="img" aria-labelledby="title desc"><title id="title">はじめてのモモンガサーチ</title><desc id="desc">いつも使う AI に追加して、出典付きの企業調査を始めましょう。。使うアプリを選ぶ：Claude Web ／ Claude Desktop ／ Codex ／ ChatGPT Desktop。モモンガサーチ＋スキルを追加する：企業検索と、24 種類の分析コマンドをまとめて導入。。モモンガのアカウントで接続する：利用権限のある本人のアカウントでログインし、接続を許可。。新しいチャットで、最初の検索：「モモンガサーチを使って、トヨタ自動車（7203）の直近決算を調べて」</desc><rect width="100%" height="100%" rx="24" fill="#f5f3ec"/><g font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="48" y="40" font-size="15" fill="#72705e">MOMONGA SEARCH  /  操作ガイド図（実画面ではありません）</text><text x="48" y="88" font-size="30" font-weight="700" fill="#243a32">はじめてのモモンガサーチ</text><text x="48" y="123" font-size="18" fill="#53645c">いつも使う AI に追加して、出典付きの企業調査を始めましょう。</text><rect x="48" y="150" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="189" r="23" fill="#315f49"/><text x="88" y="197" text-anchor="middle" font-size="23" fill="white">1</text><text x="130" y="189" font-size="24" font-weight="600" fill="#243a32">使うアプリを選ぶ</text><text x="130" y="226" font-size="19" fill="#53645c">Claude Web ／ Claude Desktop ／ Codex ／ ChatGPT Desktop</text><rect x="48" y="280" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="319" r="23" fill="#315f49"/><text x="88" y="327" text-anchor="middle" font-size="23" fill="white">2</text><text x="130" y="319" font-size="24" font-weight="600" fill="#243a32">モモンガサーチ＋スキルを追加する</text><text x="130" y="356" font-size="19" fill="#53645c">企業検索と、24 種類の分析コマンドをまとめて導入。</text><rect x="48" y="410" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="449" r="23" fill="#315f49"/><text x="88" y="457" text-anchor="middle" font-size="23" fill="white">3</text><text x="130" y="449" font-size="24" font-weight="600" fill="#243a32">モモンガのアカウントで接続する</text><text x="130" y="486" font-size="19" fill="#53645c">利用権限のある本人のアカウントでログインし、接続を許可。</text><rect x="48" y="540" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="579" r="23" fill="#315f49"/><text x="88" y="587" text-anchor="middle" font-size="23" fill="white">4</text><text x="130" y="579" font-size="24" font-weight="600" fill="#243a32">新しいチャットで、最初の検索</text><text x="130" y="616" font-size="19" fill="#53645c">「モモンガサーチを使って、トヨタ自動車（7203）の直近決算を調べて」</text><text x="48" y="702" font-size="17" fill="#53645c">ゴール：モモンガのツールが動き、資料名・日付・出典リンク付きの結果が返る。</text></g></svg>
