<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730" role="img" aria-labelledby="title desc"><title id="title">困ったときは、止まった場所から</title><desc id="desc">下の順で確認すると、原因を切り分けやすくなります。。一覧にない → 導入を確認：リポジトリ URL、マーケットプレイスの同期、利用中の組織を確認。。コマンドがない → スキル付き版を確認：momonga-search-skills が有効か確認し、新しいチャットを開く。。ログインできない → 接続をやり直す：アプリから認証を開始し直す。認証エラーはその文面を記録。。接続済みでも検索できない → 権限とエラーを確認：利用アカウント、契約、ツール使用許可を確認。解消しなければ管理者へ。</desc><rect width="100%" height="100%" rx="24" fill="#f5f3ec"/><g font-family="Hiragino Sans, Noto Sans JP, sans-serif"><text x="48" y="40" font-size="15" fill="#72705e">MOMONGA SEARCH  /  操作ガイド図（実画面ではありません）</text><text x="48" y="88" font-size="30" font-weight="700" fill="#243a32">困ったときは、止まった場所から</text><text x="48" y="123" font-size="18" fill="#53645c">下の順で確認すると、原因を切り分けやすくなります。</text><rect x="48" y="150" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="189" r="23" fill="#315f49"/><text x="88" y="197" text-anchor="middle" font-size="23" fill="white">1</text><text x="130" y="189" font-size="24" font-weight="600" fill="#243a32">一覧にない → 導入を確認</text><text x="130" y="226" font-size="19" fill="#53645c">リポジトリ URL、マーケットプレイスの同期、利用中の組織を確認。</text><rect x="48" y="280" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="319" r="23" fill="#315f49"/><text x="88" y="327" text-anchor="middle" font-size="23" fill="white">2</text><text x="130" y="319" font-size="24" font-weight="600" fill="#243a32">コマンドがない → スキル付き版を確認</text><text x="130" y="356" font-size="19" fill="#53645c">momonga-search-skills が有効か確認し、新しいチャットを開く。</text><rect x="48" y="410" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="449" r="23" fill="#315f49"/><text x="88" y="457" text-anchor="middle" font-size="23" fill="white">3</text><text x="130" y="449" font-size="24" font-weight="600" fill="#243a32">ログインできない → 接続をやり直す</text><text x="130" y="486" font-size="19" fill="#53645c">アプリから認証を開始し直す。認証エラーはその文面を記録。</text><rect x="48" y="540" width="1004" height="108" rx="16" fill="white" stroke="#d9dfd6"/><circle cx="88" cy="579" r="23" fill="#315f49"/><text x="88" y="587" text-anchor="middle" font-size="23" fill="white">4</text><text x="130" y="579" font-size="24" font-weight="600" fill="#243a32">接続済みでも検索できない → 権限とエラーを確認</text><text x="130" y="616" font-size="19" fill="#53645c">利用アカウント、契約、ツール使用許可を確認。解消しなければ管理者へ。</text><text x="48" y="702" font-size="17" fill="#53645c">問い合わせにはアプリ名・発生時刻・操作・エラーを添付。パスワードやトークンは不要。</text></g></svg>
